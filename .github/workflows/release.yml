name: Build and release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.3
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          if ('${{ github.ref_type }}' -ne 'tag' -or '${{ github.ref_name }}' -ne "v$version") {
            throw 'Run this workflow on the tag matching version.py'
          }
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python build.py
      - name: Publish EXE and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $tag = "v$version"
          $asset = "dist/MTU_Link_Tester_v$version.exe"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "Link Lab $tag" --notes-file CHANGELOG.md --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag $asset --clobber --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { throw 'EXE upload failed' }
